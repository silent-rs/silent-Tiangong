[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "辅助构建任务：wasm 组件构建与部署"

[dependencies]
base64 = { workspace = true }
hex = { workspace = true }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tar = { workspace = true }
zstd = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
url = { workspace = true }

[[bin]]
name = "xtask"
path = "src/main.rs"
