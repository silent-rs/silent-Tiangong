name: Publish devkit to npm

# @silent-ai/plugin-creator（devkit CLI）自动发布到 npm。
# 触发：推 tag `devkit/v<版本>`（与 package.json 版本一致，不一致即拒绝），
# 或手动 workflow_dispatch（按 package.json 当前版本发布）。
# 认证：OIDC 可信发布（npm Trusted Publishing）——无长期 token。
# 前置（一次性）：本地手动发布首版后，在 npm 包设置页登记 Trusted
# Publisher（org: silent-rs / repo: silent-Tiangong /
# workflow: publish-devkit.yml / 勾选 npm publish），之后 CI 免 token。

on:
  push:
    tags:
      - "devkit/v*"
  workflow_dispatch:

permissions:
  contents: read
  # npm provenance（供应链来源证明，attestation 随包发布）
  id-token: write

jobs:
  publish:
    name: Publish @silent-ai/plugin-creator
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: plugins/devkit
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#devkit/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag 版本 $TAG_VERSION 与 package.json 版本 $PKG_VERSION 不一致"
            exit 1
          fi
          echo "发布版本：$PKG_VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # 可信发布要求 npm ≥ 11.5.1（OIDC 支持）；Node 22 自带 npm 10.x，先升级
      - name: 升级 npm（OIDC 可信发布要求 ≥ 11.5.1）
        run: npm install -g npm@latest && npm --version

      # 发布前干跑校验：files 清单完整、bin 可执行位、无多余文件
      - name: 发布前校验（pack 干跑）
        run: |
          npm pack --dry-run
          node --check bin/cli.mjs
          node --check src/init.mjs
          node --check src/validate.mjs
          node --check src/build.mjs
          node --check src/run.mjs
          node --check src/logs.mjs

      # 裸 npm publish：npm 自动探测 OIDC 环境完成认证，无需 token；
      # provenance 随可信发布自动生成。
      - name: 发布到 npm（OIDC 可信发布）
        run: npm publish --access public

      - name: 发布摘要
        run: |
          echo "已发布 @silent-ai/plugin-creator@$(node -p "require('./package.json').version")"
          echo "Agent 命令引用（同步更新插件说明书与 tools.ts 的 DEVKIT_VERSION）："
          echo "npx -y @silent-ai/plugin-creator@$(node -p "require('./package.json').version") <命令>"
