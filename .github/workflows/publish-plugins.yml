name: Publish Official Plugin to OSS

on:
  workflow_dispatch:
    inputs:
      plugin_id:
        description: "插件 ID（以 plugin.json 的 id 为准）"
        required: true
        type: string
  push:
    tags:
      - "plugin/*/v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TIANGONG_PLUGIN_OSS_BASE_URL: https://silent-tiangong.oss-cn-hangzhou.aliyuncs.com

jobs:
  resolve-plugin:
    name: Resolve plugin
    runs-on: ubuntu-22.04
    outputs:
      plugin_id: ${{ steps.plugin.outputs.plugin_id }}
    steps:
      - name: Resolve plugin ID
        id: plugin
        env:
          INPUT_PLUGIN_ID: ${{ inputs.plugin_id }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            plugin_id="${GITHUB_REF_NAME#plugin/}"
            plugin_id="${plugin_id%/v*}"
          else
            plugin_id="$INPUT_PLUGIN_ID"
          fi
          if [[ -z "$plugin_id" || "$plugin_id" == */* || "$plugin_id" == *..* ]]; then
            echo "Invalid plugin ID: $plugin_id"
            exit 1
          fi
          echo "plugin_id=$plugin_id" >> "$GITHUB_OUTPUT"

  build-wasm:
    name: Build shared WASM
    needs: resolve-plugin
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Build deterministic shared WASM
        env:
          PLUGIN_ID: ${{ needs.resolve-plugin.outputs.plugin_id }}
        run: cargo run -p xtask -- build-plugin-wasm "$PLUGIN_ID" "target/shared-wasm/${PLUGIN_ID}.wasm"
      - name: Upload shared WASM
        uses: actions/upload-artifact@v4
        with:
          name: plugin-wasm-${{ needs.resolve-plugin.outputs.plugin_id }}
          path: target/shared-wasm/${{ needs.resolve-plugin.outputs.plugin_id }}.wasm
          if-no-files-found: error
          retention-days: 7
  build-plugin:
    name: Build ${{ needs.resolve-plugin.outputs.plugin_id }} (${{ matrix.plugin_platform }})
    needs: [resolve-plugin, build-wasm]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            plugin_platform: darwin-aarch64
          - runner: ubuntu-22.04
            plugin_platform: linux-x86_64
          - runner: windows-latest
            plugin_platform: windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Install Tauri signer
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install protoc on macOS
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc on Windows
        if: runner.os == 'Windows'
        run: choco install protoc -y

      # memory sidecar 通过 bundled-sqlcipher-vendored-openssl 由 openssl-sys 从源码
      # 静态编译 SQLCipher 与 OpenSSL 并链接进 sidecar.exe，产物自包含，运行时不再
      # 依赖 libcrypto-3-x64.dll。因此 Windows 下既不需要配置系统 OpenSSL 路径，更不能
      # 设置 OPENSSL_NO_VENDOR=1——那会让 openssl-sys 改用系统动态库，导致用户机器缺 DLL。
      # 注意：vendored 编译需要完整 Perl 驱动 OpenSSL 的 Configure；windows-latest 虽预装
      # Strawberry Perl，但 Git Bash 每个 step 会重排 PATH，使自带的精简 MSYS2 Perl 优先（缺
      # Locale::Maketext::Simple 等模块，OpenSSL Configure 启动即失败）。$GITHUB_PATH 在 Git Bash
      # 下无法可靠地让 Strawberry 优先，因此必须在执行构建的同一 shell 内前置——见下方
      # Build and sign plugin 步骤。
      - name: Download shared WASM
        uses: actions/download-artifact@v4
        with:
          name: plugin-wasm-${{ needs.resolve-plugin.outputs.plugin_id }}
          path: target/shared-wasm
      - name: Validate plugin from repository configuration
        env:
          PLUGIN_ID: ${{ needs.resolve-plugin.outputs.plugin_id }}
        run: cargo run -p xtask -- validate-plugin "$PLUGIN_ID"

      - name: Test cross-platform file handling
        if: needs.resolve-plugin.outputs.plugin_id == 'fs'
        run: cargo test -p tiangong-plugin-fs-sidecar -p tiangong-media-archive

      - name: Prepare plugin signing key
        id: plugin_signing
        env:
          PLUGIN_SIGNING_PRIVATE_KEY: ${{ secrets.TIANGONG_PLUGIN_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$PLUGIN_SIGNING_PRIVATE_KEY" ]]; then
            echo "TIANGONG_PLUGIN_SIGNING_PRIVATE_KEY is required."
            exit 1
          fi
          key_path="$RUNNER_TEMP/tiangong-plugin-signing.key"
          printf '%s' "$PLUGIN_SIGNING_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "key_path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Build and sign plugin
        env:
          PLUGIN_ID: ${{ needs.resolve-plugin.outputs.plugin_id }}
          TIANGONG_PLUGIN_SIGNING_PRIVATE_KEY_PATH: ${{ steps.plugin_signing.outputs.key_path }}
          TIANGONG_PLUGIN_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TIANGONG_PLUGIN_SIGNING_PRIVATE_KEY_PASSWORD }}
          TIANGONG_PLUGIN_PREBUILT_WASM: ${{ github.workspace }}/target/shared-wasm/${{ needs.resolve-plugin.outputs.plugin_id }}.wasm
        run: |
          if [[ "$(uname -s)" == MINGW* ]]; then
            # Git Bash 每个 step 会重排 PATH，使 MSYS2 自带 perl 优先于 Strawberry；
            # 必须在执行 cargo 的同一 shell 内前置，openssl-src 的 build script（作为 cargo
            # 子进程）才会用到 Strawberry Perl。先自检所需模块，路径有误时秒级失败。
            export PATH="/c/Strawberry/perl/bin:$PATH"
            perl -e 'use Locale::Maketext::Simple; print "perl OK: $^X\n"'
          fi
          cargo run -p xtask -- build-plugin "$PLUGIN_ID"

      - name: Verify platform output
        env:
          PLUGIN_ID: ${{ needs.resolve-plugin.outputs.plugin_id }}
          EXPECTED_PLATFORM: ${{ matrix.plugin_platform }}
        run: |
          fragment="target/plugin-dist/plugins-index/fragments/${PLUGIN_ID}-${EXPECTED_PLATFORM}.json"
          test -f "$fragment"
          # release.json / release.json.sig 仅对 sidecar 插件生成；
          # 纯 WASM 插件不产出签名清单，只要求 fragment 存在。
          if compgen -G "target/plugin-dist/plugins/${PLUGIN_ID}/*/${EXPECTED_PLATFORM}/release.json" > /dev/null; then
            test -f "target/plugin-dist/plugins/${PLUGIN_ID}"/*/"${EXPECTED_PLATFORM}/release.json.sig"
          fi

      - name: Remove plugin signing key
        if: always() && steps.plugin_signing.outputs.key_path != ''
        env:
          PLUGIN_SIGNING_KEY_PATH: ${{ steps.plugin_signing.outputs.key_path }}
        run: rm -f "$PLUGIN_SIGNING_KEY_PATH"

      - name: Upload platform plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-dist-${{ needs.resolve-plugin.outputs.plugin_id }}-${{ matrix.plugin_platform }}
          path: |
            target/plugin-dist/plugins/${{ needs.resolve-plugin.outputs.plugin_id }}/
            target/plugin-dist/plugins-index/fragments/${{ needs.resolve-plugin.outputs.plugin_id }}-${{ matrix.plugin_platform }}.json
          if-no-files-found: error
          retention-days: 7

  prepare-release:
    name: Prepare independent plugin release
    needs: [resolve-plugin, build-plugin]
    runs-on: ubuntu-22.04
    outputs:
      plugin_id: ${{ needs.resolve-plugin.outputs.plugin_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-dist-${{ needs.resolve-plugin.outputs.plugin_id }}-*
          path: target/plugin-platforms

      - name: Merge and validate selected plugin
        env:
          PLUGIN_ID: ${{ needs.resolve-plugin.outputs.plugin_id }}
          TIANGONG_PLUGIN_EXPECTED_PLATFORMS: darwin-aarch64,linux-x86_64,windows-x86_64
        run: |
          cargo run -p xtask -- merge-plugin-dist "$PLUGIN_ID" target/plugin-platforms target/plugin-release
          # 纯 WASM 插件不生成 release.json/sig，只在有签名清单时验证数量。
          release_count=$(find target/plugin-release/plugins -name release.json | wc -l | tr -d ' ')
          if [ "$release_count" -gt 0 ]; then
            test "$release_count" = "3"
            test "$(find target/plugin-release/plugins -name release.json.sig | wc -l | tr -d ' ')" = "3"
          fi

      - name: Upload independent release artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-release-${{ needs.resolve-plugin.outputs.plugin_id }}
          path: target/plugin-release/
          if-no-files-found: error
          retention-days: 30

  publish-plugin:
    name: Publish independent plugin
    needs: [resolve-plugin, prepare-release]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    concurrency:
      group: plugin-oss-catalog-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download independent release artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-release-${{ needs.resolve-plugin.outputs.plugin_id }}
          path: target/plugin-release

      - name: Install ossutil
        run: |
          curl --connect-timeout 10 --max-time 120 --retry 3 --retry-all-errors -fsSL \
            https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip \
            -o /tmp/ossutil.zip
          unzip -o /tmp/ossutil.zip -d /tmp/ossutil
          sudo cp /tmp/ossutil/ossutil-v1.7.18-linux-amd64/ossutil /usr/local/bin/ossutil

      - name: Configure ossutil
        run: |
          ossutil config \
            -e oss-cn-hangzhou.aliyuncs.com \
            -i "${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}" \
            -k "${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}"

      - name: Download current catalog
        run: |
          curl --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors -fsSL \
            "${TIANGONG_PLUGIN_OSS_BASE_URL}/plugins-index/catalog.json?run=${GITHUB_RUN_ID}" \
            -o target/current-catalog.json

      - name: Merge selected plugin into catalog
        run: |
          cargo run -p xtask -- merge-plugin-catalog \
            target/current-catalog.json \
            target/plugin-release/plugins-index/catalog.json \
            target/plugin-release/plugins-index/catalog.merged.json

      - name: Upload immutable selected plugin version
        env:
          PLUGIN_ID: ${{ needs.resolve-plugin.outputs.plugin_id }}
        run: |
          ossutil cp -r "target/plugin-release/plugins/${PLUGIN_ID}/" "oss://silent-tiangong/plugins/${PLUGIN_ID}/" -f
          ossutil cp "target/plugin-release/plugins-index/catalog.json" \
            "oss://silent-tiangong/plugins-index/releases/${PLUGIN_ID}.json" -f

      - name: Publish aggregate catalog last
        run: |
          catalog=target/plugin-release/plugins-index/catalog.merged.json
          timeout 5m ossutil cp target/current-catalog.json \
            oss://silent-tiangong/plugins-index/catalog.json.previous -f
          ossutil cp "$catalog" oss://silent-tiangong/plugins-index/catalog.json.next -f
          ossutil cp "$catalog" oss://silent-tiangong/plugins-index/catalog.json -f

      - name: Verify published catalog
        run: |
          rollback_catalog() {
            echo "Catalog verification failed; restoring previous catalog."
            timeout 5m ossutil cp target/current-catalog.json \
              oss://silent-tiangong/plugins-index/catalog.json -f
            curl --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors -fsSL \
              "${TIANGONG_PLUGIN_OSS_BASE_URL}/plugins-index/catalog.json?run=${GITHUB_RUN_ID}-rollback" \
              -o /tmp/rolled-back-catalog.json
            rollback_expected="$(sha256sum target/current-catalog.json | awk '{print $1}')"
            rollback_actual="$(sha256sum /tmp/rolled-back-catalog.json | awk '{print $1}')"
            test "$rollback_expected" = "$rollback_actual"
          }

          expected="$(sha256sum target/plugin-release/plugins-index/catalog.merged.json | awk '{print $1}')"
          if ! curl --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors -fsSL \
            "${TIANGONG_PLUGIN_OSS_BASE_URL}/plugins-index/catalog.json?run=${GITHUB_RUN_ID}-verify" \
            -o /tmp/published-catalog.json; then
            rollback_catalog
            exit 1
          fi
          if ! cargo run -p xtask -- validate-plugin-catalog /tmp/published-catalog.json; then
            rollback_catalog
            exit 1
          fi
          actual="$(sha256sum /tmp/published-catalog.json | awk '{print $1}')"
          if [[ "$expected" != "$actual" ]]; then
            echo "Published catalog checksum mismatch: expected=${expected}, actual=${actual}"
            rollback_catalog
            exit 1
          fi
