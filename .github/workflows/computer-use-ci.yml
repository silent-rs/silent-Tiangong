name: Computer Use Plugin CI

on:
  pull_request:
    paths:
      - "plugins/tiangong-plugin-computer-use/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/computer-use-ci.yml"
  workflow_dispatch:

concurrency:
  group: computer-use-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  wasm-build:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@v2
        with:
          key: computer-use-wasm-runtime

      - name: Check protocol for WASM
        run: cargo check -p tiangong-plugin-computer-use-protocol --target wasm32-wasip2

      - name: Build WASM component
        run: cargo build -p tiangong-plugin-computer-use-wasm --target wasm32-wasip2

      - name: Run protocol unit tests
        run: cargo nextest run -p tiangong-plugin-computer-use-protocol --no-tests pass

  platform-backend:
    name: Platform backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux AT-SPI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          key: computer-use-${{ matrix.target }}

      - name: Check sidecar platform backend
        run: cargo check -p tiangong-plugin-computer-use-sidecar --target ${{ matrix.target }}
