name: Release Bots

# bot 制品独立发布，与主程序发版节奏解耦。
#
# - tag 前缀 `bots-v*`（如 bots-v0.1.0），与主程序 `v*` 区分
# - bot 制品挂在独立的 GitHub Release（`bots-v*`），不混入主程序 Release
# - bots-index.json 以 OSS 根目录为权威源（GitHub 的 releases/latest 指向主程序，
#   bot 无法复用 latest 机制），GitHub Release 作为备份
#
# 发布方式：
#   1. 推送 bots-v0.1.0 tag 自动触发
#   2. Actions 页面手动触发（输入 tag）

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签，如 bots-v0.1.0"
        required: true
        type: string
      release_draft:
        description: "创建草稿 Release"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "bots-v*"

concurrency:
  group: release-bots-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  publish-bots:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            archive: tiangong-bot-feishu-aarch64-apple-darwin
          - platform: macos-13
            target: x86_64-apple-darwin
            archive: tiangong-bot-feishu-x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tiangong-bot-feishu-x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            archive: tiangong-bot-feishu-x86_64-pc-windows-msvc.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            draft="false"
          else
            tag="${{ inputs.tag }}"
            draft="${{ inputs.release_draft }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            bots/feishu -> target

      - name: Build feishu bot
        working-directory: bots/feishu
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact (unix)
        if: runner.os != 'Windows'
        run: |
          cp "bots/feishu/target/${{ matrix.target }}/release/tiangong-bot-feishu" "$RUNNER_TEMP/${{ matrix.archive }}"
          chmod +x "$RUNNER_TEMP/${{ matrix.archive }}"

      - name: Stage artifact (windows)
        if: runner.os == 'Windows'
        run: |
          cp "bots/feishu/target/${{ matrix.target }}/release/tiangong-bot-feishu.exe" "$RUNNER_TEMP/${{ matrix.archive }}"

      - name: Compute checksum
        id: checksum
        run: |
          cd "$RUNNER_TEMP"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            certutil -hashfile "${{ matrix.archive }}" SHA256 | sed -n '2p' | tr -d ' ' | awk '{print tolower($0)}' > "${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive }}" | awk '{print $1}' > "${{ matrix.archive }}.sha256"
          fi
          echo "sha256=$(cat ${{ matrix.archive }}.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          draft: ${{ steps.release.outputs.draft }}
          name: "天工 Bot ${{ steps.release.outputs.tag }}"
          body: |
            # 天工通讯网关 bot 制品 ${{ steps.release.outputs.tag }}

            飞书 bot 连接器，通过 WebSocket 长连接接收飞书消息并转发到天工。
            由天工主程序在运行时下载、启动并监控。

            ## 制品

            - `${{ matrix.archive }}`
            - SHA256: `${{ steps.checksum.outputs.sha256 }}`
          files: |
            ${{ runner.temp }}/${{ matrix.archive }}
            ${{ runner.temp }}/${{ matrix.archive }}.sha256

  generate-bots-index:
    name: Generate bots-index.json
    needs: publish-bots
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${{ inputs.tag }}"
          fi
          # bots-v0.1.0 → 0.1.0
          version="${tag#bots-v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts + checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p artifacts
          cd artifacts
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" \
            --pattern "tiangong-bot-feishu-*" \
            --clobber

      - name: Build bots-index.json
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          oss_base="https://silent-tiangong.oss-cn-hangzhou.aliyuncs.com/bots/${RELEASE_TAG}"
          read_sha() { cat "artifacts/$1.sha256" 2>/dev/null || echo ""; }

          darwin_aarch64_sha=$(read_sha tiangong-bot-feishu-aarch64-apple-darwin)
          darwin_x86_64_sha=$(read_sha tiangong-bot-feishu-x86_64-apple-darwin)
          linux_x86_64_sha=$(read_sha tiangong-bot-feishu-x86_64-unknown-linux-gnu)
          windows_x86_64_sha=$(read_sha tiangong-bot-feishu-x86_64-pc-windows-msvc.exe)

          # 从 bots/feishu/bot.json 读取 config_schema（schema 单一真相随 bot 源码维护）。
          feishu_schema=$(jq '.config_schema' bots/feishu/bot.json)

          # 用 jq 构建 bots-index.json，避免 heredoc 转义问题。
          jq -n \
            --arg version "$VERSION" \
            --argjson schema "$feishu_schema" \
            --arg darwin_aarch64_sha "$darwin_aarch64_sha" \
            --arg darwin_x86_64_sha "$darwin_x86_64_sha" \
            --arg linux_x86_64_sha "$linux_x86_64_sha" \
            --arg windows_x86_64_sha "$windows_x86_64_sha" \
            --arg oss_base "$oss_base" \
            '{
              version: 1,
              bots: [{
                id: "feishu",
                name: "飞书 Bot",
                version: $version,
                description: "飞书机器人连接器，通过 WebSocket 长连接接收飞书消息并转发到天工",
                config_schema: $schema,
                platforms: {
                  "darwin-aarch64": {url: ($oss_base + "/tiangong-bot-feishu-aarch64-apple-darwin"), checksum: ("sha256:" + $darwin_aarch64_sha)},
                  "darwin-x86_64": {url: ($oss_base + "/tiangong-bot-feishu-x86_64-apple-darwin"), checksum: ("sha256:" + $darwin_x86_64_sha)},
                  "linux-x86_64": {url: ($oss_base + "/tiangong-bot-feishu-x86_64-unknown-linux-gnu"), checksum: ("sha256:" + $linux_x86_64_sha)},
                  "windows-x86_64": {url: ($oss_base + "/tiangong-bot-feishu-x86_64-pc-windows-msvc.exe"), checksum: ("sha256:" + $windows_x86_64_sha)}
                },
                min_app_version: "0.12.3"
              }]
            }' > bots-index.json

          echo "--- bots-index.json ---"
          cat bots-index.json

      - name: Attach bots-index.json to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" bots-index.json --clobber --repo "${{ github.repository }}"

  upload-to-oss:
    name: Upload to Aliyun OSS
    needs: generate-bots-index
    runs-on: ubuntu-22.04
    if: ${{ needs.generate-bots-index.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${{ inputs.tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download bot artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p oss-upload
          cd oss-upload
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" \
            --pattern "tiangong-bot-feishu-*" \
            --pattern "bots-index.json" \
            --clobber

      - name: Install ossutil
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip -o /tmp/ossutil.zip
          unzip -o /tmp/ossutil.zip -d /tmp/ossutil
          sudo cp /tmp/ossutil/ossutil-v1.7.18-linux-amd64/ossutil /usr/local/bin/ossutil

      - name: Configure ossutil
        run: |
          ossutil config \
            -e oss-cn-hangzhou.aliyuncs.com \
            -i "${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}" \
            -k "${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}"

      - name: Upload bot artifacts (versioned path)
        working-directory: oss-upload
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "Uploading bot artifacts to OSS: bots/${RELEASE_TAG}/"
          for f in tiangong-bot-feishu-*; do
            if [[ -f "$f" ]]; then
              echo "  Uploading $f -> bots/${RELEASE_TAG}/${f}"
              ossutil cp "$f" "oss://silent-tiangong/bots/${RELEASE_TAG}/${f}" -f
            fi
          done

      - name: Upload bots-index.json (root)
        working-directory: oss-upload
        run: |
          echo "Uploading bots-index.json to OSS root"
          ossutil cp bots-index.json "oss://silent-tiangong/bots-index.json" -f
