name: Release Weixin Bot

# 微信 bot 独立发版，仅管理自己的 tag 和 Release，与其他 bot 互不影响。
#
# - tag 约定：bot-weixin-v<version>（如 bot-weixin-v0.1.0）
# - 制品挂在独立的 GitHub Release（bot-weixin-v*）
# - Release 附带只包含微信条目的 bots-index.json
# - OSS 使用 bots-index/weixin.json，发布时不读写其他 bot 的索引

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签，如 bot-weixin-v0.1.0"
        required: true
        type: string
      release_draft:
        description: "创建草稿 Release"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "bot-weixin-v*"

concurrency:
  group: release-weixin-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BOT_ID: weixin

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
      draft: ${{ steps.parse.outputs.draft }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse tag
        id: parse
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            draft="false"
          else
            tag="${{ inputs.tag }}"
            draft="${{ inputs.release_draft }}"
          fi

          # 解析 bot-weixin-v<version>
          if [[ ! "$tag" =~ ^bot-weixin-v([0-9].*)$ ]]; then
            echo "::error::标签格式无效：期望 'bot-weixin-v<version>'（如 bot-weixin-v0.1.0），实际 '$tag'"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

  publish-bot:
    name: Build ${{ matrix.target }}
    needs: resolve
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            bots/weixin -> ../../target

      - name: Build bot
        run: cargo build --release --locked --manifest-path bots/weixin/Cargo.toml --target ${{ matrix.target }}

      - name: Stage artifact (unix)
        if: runner.os != 'Windows'
        run: |
          archive="tiangong-bot-weixin-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/tiangong-bot-weixin" "$RUNNER_TEMP/${archive}"
          chmod +x "$RUNNER_TEMP/${archive}"

      - name: Stage artifact (windows)
        if: runner.os == 'Windows'
        run: |
          archive="tiangong-bot-weixin-${{ matrix.target }}.exe"
          cp "target/${{ matrix.target }}/release/tiangong-bot-weixin.exe" "$RUNNER_TEMP/${archive}"

      - name: Compute checksum
        run: |
          cd "$RUNNER_TEMP"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            certutil -hashfile tiangong-bot-weixin-${{ matrix.target }}.exe SHA256 | sed -n '2p' | tr -d ' ' | awk '{print tolower($0)}' > tiangong-bot-weixin-${{ matrix.target }}.exe.sha256
          else
            shasum -a 256 tiangong-bot-weixin-${{ matrix.target }} | awk '{print $1}' > tiangong-bot-weixin-${{ matrix.target }}.sha256
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          draft: ${{ needs.resolve.outputs.draft }}
          name: "天工微信 Bot ${{ needs.resolve.outputs.tag }}"
          body: |
            # 天工微信 bot 制品 ${{ needs.resolve.outputs.tag }}

            微信机器人连接器，基于腾讯 iLink 协议长轮询接收微信消息并转发到天工。
            由天工主程序在运行时下载、启动并监控。
          files: |
            ${{ runner.temp }}/tiangong-bot-weixin-*

  generate-bots-index:
    name: Generate bots-index.json
    needs: [resolve, publish-bot]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bot artifacts + checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          cd artifacts
          gh release download "${{ needs.resolve.outputs.tag }}" --repo "${{ github.repository }}" \
            --pattern "tiangong-bot-weixin-*" \
            --clobber

      - name: Build bots-index.json
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          oss_base="https://silent-tiangong.oss-cn-hangzhou.aliyuncs.com/bots/${TAG}"
          bot_id="weixin"

          read_sha() {
            local checksum_file="artifacts/$1.sha256"
            if [[ ! -s "$checksum_file" ]]; then
              echo "::error::缺少校验文件：$checksum_file" >&2
              exit 1
            fi
            tr -d '\r\n' < "$checksum_file"
          }

          darwin_aarch64_sha=$(read_sha tiangong-bot-${bot_id}-aarch64-apple-darwin)
          darwin_x86_64_sha=$(read_sha tiangong-bot-${bot_id}-x86_64-apple-darwin)
          linux_x86_64_sha=$(read_sha tiangong-bot-${bot_id}-x86_64-unknown-linux-gnu)
          windows_x86_64_sha=$(read_sha tiangong-bot-${bot_id}-x86_64-pc-windows-msvc.exe)

          # 当前 bot 的元数据（从源码中的 bot.json 读取）
          schema=$(jq '.config_schema' "bots/${bot_id}/bot.json")
          name=$(jq -r '.name // "微信 Bot"' "bots/${bot_id}/bot.json")
          description=$(jq -r '.description // "微信机器人连接器"' "bots/${bot_id}/bot.json")
          min_app_version=$(jq -r '.min_app_version // "0.12.3"' "bots/${bot_id}/bot.json")

          # 当前 bot 的完整条目
          current_entry=$(jq -n \
            --arg id "$bot_id" \
            --arg name "$name" \
            --arg version "$VERSION" \
            --arg description "$description" \
            --argjson schema "$schema" \
            --arg min_app_version "$min_app_version" \
            --arg darwin_aarch64_sha "$darwin_aarch64_sha" \
            --arg darwin_x86_64_sha "$darwin_x86_64_sha" \
            --arg linux_x86_64_sha "$linux_x86_64_sha" \
            --arg windows_x86_64_sha "$windows_x86_64_sha" \
            --arg oss_base "$oss_base" \
            '{
              id: $id,
              name: $name,
              version: $version,
              description: $description,
              config_schema: $schema,
              platforms: {
                "darwin-aarch64": {url: ($oss_base + "/tiangong-bot-" + $id + "-aarch64-apple-darwin"), checksum: ("sha256:" + $darwin_aarch64_sha)},
                "darwin-x86_64": {url: ($oss_base + "/tiangong-bot-" + $id + "-x86_64-apple-darwin"), checksum: ("sha256:" + $darwin_x86_64_sha)},
                "linux-x86_64": {url: ($oss_base + "/tiangong-bot-" + $id + "-x86_64-unknown-linux-gnu"), checksum: ("sha256:" + $linux_x86_64_sha)},
                "windows-x86_64": {url: ($oss_base + "/tiangong-bot-" + $id + "-x86_64-pc-windows-msvc.exe"), checksum: ("sha256:" + $windows_x86_64_sha)}
              },
              min_app_version: $min_app_version
            }')

          jq -n --argjson entry "$current_entry" \
            '{version: 1, bots: [$entry]}' > artifacts/bots-index.json

          echo "--- bots-index.json ---"
          cat artifacts/bots-index.json

      - name: Attach bots-index.json to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.resolve.outputs.tag }}" \
            artifacts/bots-index.json --clobber --repo "${{ github.repository }}"

  upload-to-oss:
    name: Upload to Aliyun OSS
    needs: [resolve, generate-bots-index]
    runs-on: ubuntu-22.04
    if: ${{ needs.generate-bots-index.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bot artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p oss-upload
          cd oss-upload
          gh release download "${{ needs.resolve.outputs.tag }}" --repo "${{ github.repository }}" \
            --pattern "tiangong-bot-weixin-*" \
            --pattern "bots-index.json" \
            --clobber

      - name: Install ossutil
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip -o /tmp/ossutil.zip
          unzip -o /tmp/ossutil.zip -d /tmp/ossutil
          sudo cp /tmp/ossutil/ossutil-v1.7.18-linux-amd64/ossutil /usr/local/bin/ossutil

      - name: Configure ossutil
        run: |
          ossutil config \
            -e oss-cn-hangzhou.aliyuncs.com \
            -i "${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}" \
            -k "${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}"

      - name: Upload bot artifacts (versioned path)
        working-directory: oss-upload
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          echo "Uploading weixin artifacts to OSS: bots/${TAG}/"
          for f in tiangong-bot-weixin-*; do
            if [[ -f "$f" ]]; then
              echo "  Uploading $f -> bots/${TAG}/${f}"
              ossutil cp "$f" "oss://silent-tiangong/bots/${TAG}/${f}" -f
            fi
          done

      - name: Upload bot index
        working-directory: oss-upload
        run: |
          echo "Uploading bots-index.json to OSS: bots-index/${BOT_ID}.json"
          ossutil cp bots-index.json "oss://silent-tiangong/bots-index/${BOT_ID}.json" -f
