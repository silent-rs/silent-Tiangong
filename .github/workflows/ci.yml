name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      # 是否触发了任何后端 Rust 改动（含 workflow 自身），用于编排 fmt / tauri / frontend
      rust: ${{ steps.resolve.outputs.rust }}
      frontend: ${{ steps.resolve.outputs.frontend }}
      # 需要校验的 crate 列表（JSON 数组），仅含被直接改动的 crate。
      # 不做反向依赖闭包扩散，避免底层改动触发几乎全部上游作业。
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      # 完整克隆：改动文件解析需用 git diff base.sha...HEAD，
      # 默认 fetch-depth: 1 是浅克隆，base commit 不可达会导致 diff 为空、matrix=[]。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            rust_any:
              - 'crates/**'
              - 'src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'

      - name: Resolve affected crates
        id: resolve
        env:
          FRONTEND_ANY: ${{ steps.filter.outputs.frontend }}
          RUST_ANY: ${{ steps.filter.outputs.rust_any }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # 1) 顶层 Rust / frontend 开关
          if [[ "$RUST_ANY" == "true" ]]; then rust_flag="true"; else rust_flag="false"; fi
          if [[ "$FRONTEND_ANY" == "true" ]]; then frontend_flag="true"; else frontend_flag="false"; fi

          # 2) 若无任何 Rust 改动，直接输出空矩阵，跳过全部逐 crate 作业
          if [[ "$rust_flag" != "true" ]]; then
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "frontend=${frontend_flag}" >> "$GITHUB_OUTPUT"
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3) 解析 diff。PR 用 base..HEAD，push 事件用 before..HEAD，兜底取全部文件。
          if [[ -n "$PR_BASE" ]]; then
            range="${PR_BASE}...HEAD"
          elif [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            range="${BEFORE}..HEAD"
          else
            range=""
          fi

          if [[ -n "$range" ]]; then
            mapfile -t files < <(git diff --name-only "$range")
          else
            mapfile -t files < <(git diff --name-only HEAD)
          fi

          # 把改动文件列表经环境变量传给 Python（换行分隔）
          export CHANGED_FILES="$(printf '%s\n' "${files[@]}")"

          # 4) 用 Python 计算受影响的 crate 闭包：把改动文件映射到 crate，
          #    再沿正向依赖图把闭包扩展到所有直接/间接依赖它们的上游 crate。
          matrix_json="$(python3 <<'PY'
          import json, os

          # workspace 中所有 crate -> 其源码目录前缀（相对仓库根）
          # 包名与 cargo -p 用的标识一致；src-tauri 的二进制包名为 tiangong-app，
          # 根二进制（src/main.rs）包名为 tiangong
          crate_to_prefix = {
              "tiangong-types":           "crates/tiangong-types/",
              "tiangong-anthropic":       "crates/tiangong-anthropic/",
              "tiangong-deepseek":        "crates/tiangong-deepseek/",
              "tiangong-media":           "crates/tiangong-media/",
              "tiangong-scheduler":       "crates/tiangong-scheduler/",
              "tiangong-llm":             "crates/tiangong-llm/",
              "tiangong-config":          "crates/tiangong-config/",
              "tiangong-memory":          "crates/tiangong-memory/",
              "tiangong-core":            "crates/tiangong-core/",
              "tiangong-cli":             "crates/tiangong-cli/",
              "tiangong-server":          "crates/tiangong-server/",
              "tiangong-entry":           "crates/tiangong-entry/",
              "tiangong-plugin-browser":         "crates/plugins/tiangong-plugin-browser/",
              "tiangong-plugin-command":         "crates/plugins/tiangong-plugin-command/",
              "tiangong-plugin-fetch":           "crates/plugins/tiangong-plugin-fetch/",
              "tiangong-plugin-fs":              "crates/plugins/tiangong-plugin-fs/",
              "tiangong-plugin-index":           "crates/plugins/tiangong-plugin-index/",
              "tiangong-plugin-generate-image":  "crates/plugins/tiangong-plugin-generate-image/",
              "tiangong-plugin-generate-video":  "crates/plugins/tiangong-plugin-generate-video/",
              "tiangong-plugin-text-to-speech":  "crates/plugins/tiangong-plugin-text-to-speech/",
              "tiangong-plugin-speech-to-text":  "crates/plugins/tiangong-plugin-speech-to-text/",
              "tiangong-plugin-memory":         "crates/plugins/tiangong-plugin-memory/",
              "tiangong-plugin-scheduler":      "crates/plugins/tiangong-plugin-scheduler/",
              "tiangong-plugin-terminal":       "crates/plugins/tiangong-plugin-terminal/",
              "tiangong-plugin-analyze-attachment": "crates/plugins/tiangong-plugin-analyze-attachment/",
              "tiangong-app":             "src-tauri/",
              "tiangong":                 "src/",
          }

          files = os.environ.get("CHANGED_FILES", "")
          file_list = [f for f in files.splitlines() if f]

          # 只校验被直接改动的 crate（不做反向依赖闭包扩散）。
          # 闭包扩散会让底层 crate 改动触发几乎全部上游作业，而每个作业又各自
          # 全量编译依赖闭包，总编译量远超单次 workspace 校验，反而更慢更费资源。
          # 直接改动校验已能覆盖大多数破坏；上游编译问题由 Rust fmt（workspace 级）
          # 与单次 workspace check 兜底。
          order = list(crate_to_prefix.keys())
          affected = [c for c in order if any(f.startswith(crate_to_prefix[c]) for f in file_list)]

          print(json.dumps(affected))
          PY
          )"

          echo "Affected crates: $matrix_json"
          echo "rust=true" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend_flag}" >> "$GITHUB_OUTPUT"
          echo "matrix=${matrix_json}" >> "$GITHUB_OUTPUT"

  rust-fmt:
    name: Rust fmt (workspace)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        # 格式校验必须保证整个 workspace 一致，因此仅做一次、不按 crate 拆分
        run: cargo fmt --all -- --check

  # 逐 crate 校验：changes 作业已按依赖闭包筛选出真正受影响的 crate，
  # 这里只对它们运行 check / clippy / test。
  # cargo -p <crate> 仅编译该 crate 的依赖闭包，避免触发全量 workspace 编译。
  rust-crate:
    name: Rust ${{ matrix.crate }}
    needs: changes
    if: needs.changes.outputs.matrix != '[]' && needs.changes.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux system dependencies
        # tiangong-core / tiangong-memory 间接引入 tantivy/lancedb/rusqlite/scraper，
        # tiangong-plugin-* 与 tiangong-app 引入 tauri，均需下列系统库。
        # 为避免逐 crate 维护系统依赖矩阵，统一安装一次。
        run: |
          # GitHub runner 预装的 Microsoft apt 源偶发 403，提前移除避免污染 apt-get update
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check crate
        run: cargo check -p ${{ matrix.crate }}

      - name: Run clippy
        run: cargo clippy -p ${{ matrix.crate }} --all-targets --tests --benches -- -D warnings

      - name: Run nextest
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "-C linker-features=-lld"
        run: cargo nextest run -p ${{ matrix.crate }} --no-tests pass

  tauri:
    name: Tauri Shell Check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check Tauri shell
        run: cargo check --manifest-path src-tauri/Cargo.toml

  frontend:
    name: Frontend Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: yarn --cwd frontend install --frozen-lockfile

      - name: Run frontend tests
        run: yarn --cwd frontend test

      - name: Build frontend
        run: yarn --cwd frontend build
