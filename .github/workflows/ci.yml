name: App CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect App Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.resolve.outputs.frontend }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve affected App crates
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ -n "$PR_BASE" ]]; then
            mapfile -t files < <(git diff --name-only "$PR_BASE...HEAD")
          else
            files=()
          fi

          sandbox_only="$(
            printf '%s\n' "${files[@]}" | bash .github/scripts/sandbox-change-scope.sh
          )"
          if [[ "$sandbox_only" == "true" ]]; then
            echo "Sandbox-only change: App CI is delegated to Sandbox CI"
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            echo 'frontend=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          check_all=false
          fallback_all=false
          fallback_frontend=false
          scoped_change=false
          frontend=false
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            check_all=true
            frontend=true
          fi

          for file in "${files[@]}"; do
            case "$file" in
              .cargo/*)
                check_all=true
                ;;
              Cargo.toml|Cargo.lock|.github/actions/setup-rust/*)
                fallback_all=true
                ;;
              .github/workflows/ci.yml)
                fallback_all=true
                fallback_frontend=true
                ;;
            esac
            case "$file" in
              frontend/*|src/*|src-tauri/*|crates/*|plugins/*|bots/*)
                scoped_change=true
                ;;
            esac
            case "$file" in
              frontend/*)
                frontend=true
                ;;
            esac
          done

          if [[ "$fallback_all" == "true" && "$scoped_change" != "true" ]]; then
            check_all=true
            if [[ "$fallback_frontend" == "true" ]]; then
              frontend=true
            fi
          fi

          workspace="$(pwd)/"
          metadata="$(cargo metadata --no-deps --format-version 1 --locked)"
          packages="$(
            jq -c --arg workspace "$workspace" '
              [
                .packages[]
                | select(.manifest_path | startswith($workspace))
                | select((.manifest_path | contains("/plugins/")) | not)
                | select((.manifest_path | endswith("/xtask/Cargo.toml")) | not)
                | {
                    name,
                    prefix: (
                      if .manifest_path == ($workspace + "Cargo.toml")
                      then "src/"
                      else (.manifest_path | ltrimstr($workspace) | rtrimstr("Cargo.toml"))
                      end
                    )
                  }
              ]
            ' <<< "$metadata"
          )"

          affected='[]'
          mapfile -t package_rows < <(jq -c '.[]' <<< "$packages")
          for row in "${package_rows[@]}"; do
            name="$(jq -r '.name' <<< "$row")"
            prefix="$(jq -r '.prefix' <<< "$row")"
            selected="$check_all"
            if [[ "$selected" != "true" ]]; then
              for file in "${files[@]}"; do
                if [[ "$file" == "$prefix"* ]]; then
                  selected=true
                  break
                fi
              done
            fi
            if [[ "$selected" == "true" ]]; then
              affected="$(jq -c --arg name "$name" '. + [$name] | unique' <<< "$affected")"
            fi
          done

          echo "App crates: $affected"
          echo "Frontend: $frontend"
          echo "matrix=$affected" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  rust-fmt:
    name: App Rust fmt
    needs: changes
    if: needs.changes.outputs.matrix != '[]' && needs.changes.outputs.matrix != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: |
          packages=()
          while IFS= read -r package; do
            packages+=(-p "$package")
          done < <(jq -r '.[]' <<< "$MATRIX")
          cargo fmt "${packages[@]}" -- --check

  rust-check:
    name: App Rust check
    needs: changes
    if: needs.changes.outputs.matrix != '[]' && needs.changes.outputs.matrix != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup-rust
        with:
          matrix: ${{ needs.changes.outputs.matrix }}
      - name: Prepare sandbox launcher artifact
        if: contains(fromJSON(needs.changes.outputs.matrix), 'tiangong-app')
        run: cargo run --locked -p xtask -- prepare-sandbox
      - name: Check crates
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: |
          packages=()
          while IFS= read -r package; do
            packages+=(-p "$package")
          done < <(jq -r '.[]' <<< "$MATRIX")
          cargo check "${packages[@]}"

  rust-clippy:
    name: App Rust clippy
    needs: changes
    if: needs.changes.outputs.matrix != '[]' && needs.changes.outputs.matrix != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup-rust
        with:
          matrix: ${{ needs.changes.outputs.matrix }}
          components: clippy
      - name: Prepare sandbox launcher artifact
        if: contains(fromJSON(needs.changes.outputs.matrix), 'tiangong-app')
        run: cargo run --locked -p xtask -- prepare-sandbox
      - name: Lint crates
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: |
          packages=()
          while IFS= read -r package; do
            packages+=(-p "$package")
          done < <(jq -r '.[]' <<< "$MATRIX")
          cargo clippy "${packages[@]}" --all-targets --tests --benches -- -D warnings

  rust-test:
    name: App Rust nextest
    needs: changes
    if: needs.changes.outputs.matrix != '[]' && needs.changes.outputs.matrix != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup-rust
        with:
          matrix: ${{ needs.changes.outputs.matrix }}
          install-nextest: true
      - name: Prepare sandbox launcher artifact
        if: contains(fromJSON(needs.changes.outputs.matrix), 'tiangong-app')
        run: cargo run --locked -p xtask -- prepare-sandbox
      - name: Test crates
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "-C linker-features=-lld"
        run: |
          packages=()
          while IFS= read -r package; do
            packages+=(-p "$package")
          done < <(jq -r '.[]' <<< "$MATRIX")
          cargo nextest run "${packages[@]}" --no-tests pass

  # 官方解释器发布链端到端（普通 CI 必跑）：Fresh Checkout 完整构建
  # plugin-creator（yarn build + xtask 组装 + 测试密钥签名 + 确定性归档 +
  # any 目录片段），随后经本地 http 目录服务真实走 目录发现 → 下载 → 解包 →
  # 官方验签（内容清单全树校验）→ 安装 → sidecar 调用 → 卸载。
  interpreter-release-e2e:
    name: Interpreter Release E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: interpreter-release-e2e

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Build official interpreter release with test key
        run: |
          key_path="${RUNNER_TEMP}/plugin-test.key"
          cargo run -p xtask -- generate-plugin-test-key "$key_path"
          test -f "${key_path}.pub"
          export TIANGONG_PLUGIN_SIGNING_PRIVATE_KEY_PATH="$key_path"
          cargo run -p xtask -- build-plugin plugin-creator
          # 断言发布产物齐备（测试必跑的先决条件）。
          test -f target/plugin-dist/plugins-index/fragments/plugin-creator-any.json
          test -f "target/plugin-dist/plugins/plugin-creator/0.2.0/plugin-creator-0.2.0.tar.zst"
          test -f target/plugin-dist/plugins/plugin-creator/0.2.0/release.json.sig

      - name: Run catalog install e2e
        env:
          TIANGONG_PLUGIN_E2E_DIST: ${{ github.workspace }}/target/plugin-dist
          # fail-closed：前置产物缺失时测试直接失败，不产生假绿灯。
          # 官方信任根不可配置：测试密钥冒充官方必须被拒，三方链路经
          # 测试存储的信任登记表导入公钥（不经环境变量）。
          TIANGONG_PLUGIN_E2E_REQUIRED: "1"
        run: >
          cargo test -p tiangong-plugin-runtime --test official_catalog_e2e
          -- --nocapture

  tauri:
    name: Tauri Shell Check
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.matrix), 'tiangong-app')
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare sandbox launcher artifact
        run: cargo run --locked -p xtask -- prepare-sandbox
      - name: Check Tauri shell
        run: cargo check --manifest-path src-tauri/Cargo.toml

  frontend:
    name: App Frontend Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Install frontend dependencies
        run: yarn --cwd frontend install --frozen-lockfile
      - name: Run frontend tests
        run: yarn --cwd frontend test
      - name: Build frontend
        run: yarn --cwd frontend build
