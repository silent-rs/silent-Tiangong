name: Bot CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: bot-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan Bot Matrix
    runs-on: ubuntu-latest
    outputs:
      bots: ${{ steps.resolve.outputs.bots }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve affected Bots
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE" ]]; then
            mapfile -t files < <(git diff --name-only "$PR_BASE...HEAD")
          else
            files=()
          fi

          check_all=false
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            check_all=true
          fi
          for file in "${files[@]}"; do
            if [[ "$file" == ".github/workflows/bot-ci.yml" ]]; then
              check_all=true
            fi
          done

          bots='[]'
          mapfile -t manifests < <(git ls-files 'bots/*/Cargo.toml' | awk -F/ 'NF == 3' | sort)
          for manifest in "${manifests[@]}"; do
            root="${manifest%/Cargo.toml}"
            bot="${root##*/}"
            selected="$check_all"
            if [[ "$selected" != "true" ]]; then
              for file in "${files[@]}"; do
                if [[ "$file" == "$root/"* ]]; then
                  selected=true
                  break
                fi
              done
            fi
            if [[ "$selected" == "true" ]]; then
              bots="$(jq -c --arg bot "$bot" '. + [$bot] | unique' <<< "$bots")"
            fi
          done

          echo "Bots: $bots"
          echo "bots=$bots" >> "$GITHUB_OUTPUT"

  bot:
    name: Bot (${{ matrix.bot }})
    needs: plan
    if: needs.plan.outputs.bots != '[]' && needs.plan.outputs.bots != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bot: ${{ fromJSON(needs.plan.outputs.bots) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Bot system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev
      - name: Cache Bot build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bots/${{ matrix.bot }} -> ../../target
      - name: Check Bot formatting
        run: cargo fmt --manifest-path bots/${{ matrix.bot }}/Cargo.toml -- --check
      - name: Check Bot
        run: cargo check --locked --manifest-path bots/${{ matrix.bot }}/Cargo.toml
      - name: Lint Bot
        run: cargo clippy --locked --manifest-path bots/${{ matrix.bot }}/Cargo.toml --all-targets -- -D warnings
      - name: Test Bot
        run: cargo test --locked --manifest-path bots/${{ matrix.bot }}/Cargo.toml

  result:
    name: Bot CI
    needs: [plan, bot]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix results
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BOT_RESULT: ${{ needs.bot.result }}
        run: |
          if [[ "$PLAN_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$BOT_RESULT" != "success" && "$BOT_RESULT" != "skipped" ]]; then
            exit 1
          fi
