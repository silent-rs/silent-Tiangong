[package]
name = "tiangong-plugin-runtime"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[package.metadata.tiangong]
transport-protocol = "0.1.0"

[dependencies]
tiangong-core = { workspace = true }
tiangong-config = { workspace = true }
tiangong-llm = { workspace = true }
tiangong-types = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time"] }
libc = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream", "rustls"] }
futures-util = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
semver = { workspace = true }
scru128 = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
minisign-verify = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }
serial_test = { workspace = true }
