[package]
name = "tiangong-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tiangong-core = { path = "../tiangong-core" }
tiangong-gateway = { path = "../tiangong-gateway" }
tiangong-connector = { path = "../tiangong-connector" }
tiangong-config = { path = "../tiangong-config" }
silent = { version = "2", features = ["upgrade"] }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "fs", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
async-channel = "2"
async-lock = "3"
scru128 = "3"
