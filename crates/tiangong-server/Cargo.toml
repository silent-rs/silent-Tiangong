[package]
name = "tiangong-server"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[dependencies]
tiangong-core = { workspace = true }
tiangong-config = { workspace = true }
tiangong-media = { workspace = true }
tiangong-types = { workspace = true }
silent = { workspace = true, features = ["upgrade", "scheduler"] }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "fs", "time"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-channel = { workspace = true }
async-lock = { workspace = true }
scru128 = { workspace = true }
chrono = { workspace = true }
hmac = "0.12"
hex = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["rustls-tls"] }
libc = { workspace = true }
