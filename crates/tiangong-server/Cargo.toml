[package]
name = "tiangong-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tiangong-core = { path = "../tiangong-core" }
silent = "2"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "fs", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
