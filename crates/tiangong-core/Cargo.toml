[package]
name = "tiangong-core"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[dependencies]
tiangong-types = { workspace = true }
tiangong-llm = { workspace = true }
tiangong-memory = { workspace = true }
tiangong-scheduler = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, default-features = false, features = ["std", "clock"] }
scru128 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
async-openai = { workspace = true, features = ["byot", "chat-completion", "model"] }
backoff = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "process", "io-util", "sync"] }
rmcp = { workspace = true, default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
reqwest = { workspace = true, default-features = false, features = ["blocking", "rustls"] }
futures-util = { workspace = true }
http = { workspace = true }
scraper = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
zip = { workspace = true, default-features = false, features = ["deflate"] }
diffy = { workspace = true, optional = true }
tiangong-media = { workspace = true }
tantivy = { workspace = true }
notify = { workspace = true }
dashmap = { workspace = true }

[features]
default = ["diffy"]
llm-debug-log = []

[dev-dependencies]
tempfile = { workspace = true }
