[package]
name = "tiangong-core"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[dependencies]
tiangong-types = { workspace = true }
tiangong-llm = { workspace = true }
tiangong-toolkit = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
chrono = { workspace = true, default-features = false, features = [
    "std",
    "clock",
] }
scru128 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "time",
    "io-util",
    "sync",
] }
tracing = { workspace = true }
typed-builder = { workspace = true }
tiangong-media = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
llm-debug-log = []

[dev-dependencies]
dirs = { workspace = true }
wiremock = { workspace = true }

[[example]]
name = "test_core"
