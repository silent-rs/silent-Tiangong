[package]
name = "tiangong-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
tiangong-types = { path = "../tiangong-types" }
tiangong-llm = { path = "../tiangong-llm" }
tiangong-memory = { path = "../tiangong-memory" }
anyhow = "1"
arc-swap = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
scru128 = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-openai = { git = "https://github.com/silent-rs/async-openai", branch = "main", package = "async-openai", features = ["byot", "chat-completion", "model"] }
backoff = "0.4"
tokio = { version = "1", features = ["rt", "time", "process", "io-util", "sync"] }
rmcp = { version = "0.17.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
futures-util = "0.3"
http = "1"
scraper = "0.19"
sha2 = "0.10"
toml = "0.8"
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
diffy = { version = "0.4", optional = true }
tiangong-media = { path = "../tiangong-media" }

[features]
default = ["diffy"]
llm-debug-log = []

[dev-dependencies]
tempfile = "3"
