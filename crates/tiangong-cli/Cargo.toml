[package]
name = "tiangong-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
tiangong-core = { path = "../tiangong-core" }
tiangong-config = { path = "../tiangong-config" }
tiangong-types = { path = "../tiangong-types" }
tiangong-memory = { path = "../tiangong-memory" }
tracing = "0.1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
anyhow = "1"
crossterm = "0.28"
ratatui = "0.28"
termimad = "0.30"
