[package]
name = "tiangong-sandbox-launcher"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "官方沙箱 Launcher（RFC 0017 独立版本化安全组件）：校验策略、探测平台、应用 OS 沙箱并启动目标进程"

[[bin]]
name = "tiangong-sandbox-launcher"
path = "src/main.rs"

[dependencies]
tiangong-sandbox = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
