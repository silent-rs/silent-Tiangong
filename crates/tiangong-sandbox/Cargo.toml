[package]
name = "tiangong-sandbox"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Command 工具的宿主强制操作系统沙箱套壳"

[[bin]]
name = "tiangong-sandbox"
path = "src/bin/tiangong-sandbox.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
tempfile = { workspace = true }
