[package]
name = "tiangong-plugin-sidecar"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "插件 sidecar 通用运行库（单例选举、IPC server、端点发布、退出信号）"
publish = false

[dependencies]
tiangong-plugin-command-protocol = { workspace = true }
tiangong-plugin-runtime = { workspace = true }
tiangong-llm = { workspace = true }
tiangong-config = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal", "macros", "time", "io-util", "net", "sync"] }
libc = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
scru128 = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
