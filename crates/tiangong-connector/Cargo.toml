[package]
name = "tiangong-connector"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
default = []
telegram = ["teloxide", "tokio/macros"]
discord = ["serenity"]
lark = ["reqwest"]

[dependencies]
tiangong-core = { path = "../tiangong-core" }
tiangong-types = { path = "../tiangong-types" }
anyhow = "1"
tokio = { version = "1", features = ["sync", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
async-trait = "0.1"
teloxide = { version = "0.13", optional = true }
serenity = { version = "0.12", optional = true, default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
