<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>索引管理</title>
    <style>
      /*__INDEX_CSS__*/
    </style>
  </head>
  <body>
    <div class="index-page">
      <header class="index-header">
        <h2>工作区索引</h2>
        <button id="refresh-btn" class="btn btn-secondary" type="button">刷新</button>
      </header>
      <p id="status" class="index-status" role="status"></p>
      <div id="list" class="index-list"></div>
      <template id="empty-template">
        <div class="index-empty">暂无工作区索引，切换工作目录后会自动创建。</div>
      </template>
      <template id="row-template">
        <div class="index-row">
          <div class="index-row-main">
            <div class="index-row-root"></div>
            <div class="index-row-meta">
              <span class="index-row-count"></span>
              <span class="index-row-updated"></span>
            </div>
          </div>
          <div class="index-row-actions">
            <button class="btn btn-secondary rebuild-btn" type="button">重建</button>
            <button class="btn btn-danger delete-btn" type="button">删除</button>
          </div>
        </div>
      </template>
    </div>
    <script>
      /*__INDEX_JS__*/
    </script>
  </body>
</html>
