[package]
name = "tiangong-plugin-generate-image-sidecar"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "Generate-Image 独立 sidecar（读取模型配置、调用图片生成、归档落盘）"
publish = false

[[bin]]
name = "tiangong-generate-image-sidecar"
path = "src/main.rs"

[dependencies]
tiangong-plugin-generate-image-protocol = { workspace = true }
tiangong-plugin-runtime = { workspace = true }
tiangong-plugin-sidecar = { workspace = true }
tiangong-core = { workspace = true }
tiangong-llm = { workspace = true }
tiangong-config = { workspace = true }
tiangong-media-archive = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal", "macros", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
