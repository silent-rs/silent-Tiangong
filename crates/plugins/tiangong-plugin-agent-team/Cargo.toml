[package]
name = "tiangong-plugin-agent-team"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[dependencies]
tiangong-core = { workspace = true }
tiangong-types = { workspace = true }
tiangong-toolkit = { workspace = true }
scru128 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
chrono = { workspace = true, default-features = false, features = ["std", "clock"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
