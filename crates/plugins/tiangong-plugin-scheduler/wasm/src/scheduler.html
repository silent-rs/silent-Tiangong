<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>定时任务</title>
  <style>/*__SCHEDULER_CSS__*/</style>
</head>
<body>
  <main class="page">
    <div id="loading-state" class="loading-state">加载中...</div>

    <section id="job-content" class="job-content" hidden>
      <!-- 顶部：计数 + 创建按钮（对齐原版 JobPanel） -->
      <div class="job-toolbar">
        <p class="job-count">共 <span id="job-count-num">0</span> 个定时任务</p>
        <button id="create-btn" class="btn btn-primary btn-sm" type="button">创建任务</button>
      </div>

      <p id="status" class="page-status" role="status" hidden></p>

      <!-- 空态 -->
      <div id="empty-state" class="empty-state" hidden>
        <p class="empty-title">暂无定时任务</p>
        <p class="empty-sub">点击「创建任务」添加一个新的 Cron 定时任务</p>
      </div>

      <!-- 任务列表 -->
      <div id="list" class="job-list" hidden></div>
    </section>

    <template id="row-template">
      <div class="job-row">
        <label class="switch">
          <input type="checkbox" class="toggle-checkbox" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
        <div class="job-row-info">
          <div class="job-row-top">
            <span class="job-row-name"></span>
            <span class="badge badge-outline job-row-schedule"></span>
          </div>
          <p class="job-row-desc"></p>
        </div>
        <div class="job-row-actions">
          <button class="btn btn-ghost btn-sm trigger-btn" type="button">触发</button>
          <button class="btn btn-ghost btn-sm runs-btn" type="button">历史</button>
          <button class="btn btn-ghost btn-sm edit-btn" type="button">编辑</button>
          <button class="btn btn-ghost btn-sm danger delete-btn" type="button">删除</button>
        </div>
      </div>
    </template>

    <!-- 创建/编辑模态框（对齐原版 JobFormDialog） -->
    <div id="form-modal" class="modal-overlay" hidden>
      <div class="modal modal-form" role="dialog" aria-modal="true" aria-labelledby="form-title">
        <button class="modal-close" type="button" id="form-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
        <div class="modal-header">
          <h3 id="form-title">创建定时任务</h3>
        </div>
        <form id="job-form" class="modal-body" novalidate>
          <input type="hidden" id="field-id" />

          <div class="field">
            <label class="field-label" for="field-name">名称</label>
            <input type="text" id="field-name" maxlength="100" placeholder="每日站会提醒" />
          </div>

          <div class="field">
            <label class="field-label" for="field-description">描述</label>
            <input type="text" id="field-description" maxlength="200" placeholder="任务描述" />
          </div>

          <!-- 定时设置：简单 / Cron 双模式 -->
          <div class="field">
            <span class="field-label">定时设置</span>
            <div class="tabs">
              <button type="button" class="tab tab-simple active" data-mode="simple">简单</button>
              <button type="button" class="tab tab-cron" data-mode="cron">Cron 表达式</button>
            </div>

            <!-- 简单模式 -->
            <div class="tab-panel" id="panel-simple">
              <div class="simple-grid">
                <div class="field">
                  <label class="field-label text-xs" for="simple-minute">分钟</label>
                  <input type="number" id="simple-minute" min="0" max="59" value="0" />
                </div>
                <div class="field">
                  <label class="field-label text-xs" for="simple-hour">小时</label>
                  <input type="number" id="simple-hour" min="0" max="23" value="9" />
                </div>
                <div class="field">
                  <label class="field-label text-xs" for="simple-weekday">星期</label>
                  <select id="simple-weekday"></select>
                </div>
              </div>
              <p class="synthesized">合成表达式：<code id="simple-preview"></code></p>
            </div>

            <!-- Cron 表达式模式 -->
            <div class="tab-panel" id="panel-cron" hidden>
              <input type="text" id="field-cron" class="mono" placeholder="0 0 9 * * *" />
              <p class="hint">格式：秒 分 时 日 月 周（6 字段）。例如每天 9 点：<code>0 0 9 * * *</code></p>
            </div>

            <!-- 校验状态 + 预览（两模式共用，对齐原版 SchedulePreview） -->
            <div id="schedule-preview"></div>
          </div>

          <div class="field">
            <label class="field-label" for="field-session">关联会话（可选）</label>
            <select id="field-session">
              <option value="">不关联，自动创建新会话</option>
            </select>
          </div>

          <div class="field">
            <label class="field-label" for="field-payload">任务内容</label>
            <textarea id="field-payload" rows="4" placeholder="触发时发送给 AI 的任务描述"></textarea>
          </div>

          <p id="form-error" class="form-error" role="alert" hidden></p>

          <div class="modal-footer">
            <button type="button" class="btn btn-outline" id="form-cancel">取消</button>
            <button type="button" class="btn btn-primary" id="form-submit" disabled>创建</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 执行历史模态框（对齐原版 RunHistoryDialog） -->
    <div id="runs-modal" class="modal-overlay" hidden>
      <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="runs-title">
        <button class="modal-close" type="button" id="runs-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
        <div class="modal-header">
          <h3 id="runs-title">任务执行历史</h3>
        </div>
        <div class="runs-body">
          <p id="runs-loading" class="runs-state">加载中...</p>
          <table class="runs-table" id="runs-table" hidden>
            <thead>
              <tr>
                <th>状态</th>
                <th>开始时间</th>
                <th>结束时间</th>
                <th>结果摘要</th>
              </tr>
            </thead>
            <tbody id="runs-tbody"></tbody>
          </table>
          <div id="runs-empty" class="runs-state" hidden>暂无执行记录</div>
        </div>
      </div>
    </div>
  </main>
  <script>/*__SCHEDULER_JS__*/</script>
</body>
</html>
