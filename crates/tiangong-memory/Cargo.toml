[package]
name = "tiangong-memory"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["sync", "time", "fs", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
scru128 = "3"
anyhow = "1"
tracing = "0.1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
sha2 = "0.10"
hex = "0.4"
tantivy = "0.22"
libc = "0.2"
tiangong-llm = { path = "../tiangong-llm" }
qdrant-client = "1"
async-trait = "0.1"
