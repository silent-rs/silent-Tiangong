[package]
name = "tiangong-memory"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[features]
default = []

[dependencies]
tiangong-plugin-memory-protocol = { workspace = true }
tiangong-plugin-runtime = { workspace = true }
tiangong-config = { workspace = true }
tokio = { workspace = true, features = [
    "sync",
    "time",
    "fs",
    "rt",
    "net",
    "io-util",
    "macros",
    "process",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, default-features = false, features = [
    "std",
    "clock",
] }
scru128 = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }
rusqlite = { workspace = true, features = [
    "bundled-sqlcipher-vendored-openssl",
] }
sha2 = { workspace = true }
hex = { workspace = true }
tantivy = { workspace = true }
tiangong-llm = { workspace = true }
tiangong-types = { workspace = true }
lancedb = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }
