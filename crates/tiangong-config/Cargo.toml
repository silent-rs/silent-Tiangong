[package]
name = "tiangong-config"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
tiangong-core = { path = "../tiangong-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
