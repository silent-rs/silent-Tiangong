[workspace]
members = [
    "crates/tiangong-types",
    "crates/tiangong-core",
    "crates/tiangong-cli",
    "crates/tiangong-entry",
    "crates/tiangong-server",
    "crates/tiangong-gateway",
    "crates/tiangong-connector",
    "crates/tiangong-media",
]
exclude = ["src-tauri"]

[package]
name = "tiangong"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tiangong"
path = "src/main.rs"

[dependencies]
tiangong-entry = { path = "crates/tiangong-entry" }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
