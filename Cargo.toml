    "crates/plugins/tiangong-plugin-skill/sidecar",
    "crates/plugins/tiangong-plugin-skill/wasm",
    "crates/plugins/tiangong-plugin-mcp/protocol",
    "crates/plugins/tiangong-plugin-mcp/sidecar",
    "crates/plugins/tiangong-plugin-mcp/wasm",
    "crates/plugins/tiangong-plugin-agent-team",
    "crates/plugins/tiangong-plugin-prompt",
    "crates/tiangong-plugin-runtime",
    "crates/tiangong-plugin-sidecar",
    "src-tauri",
    "xtask",
]

[workspace.package]
version = "0.13.4"

[workspace.dependencies]
tiangong-anthropic = { path = "crates/tiangong-anthropic" }
tiangong-app-state = { path = "crates/tiangong-app-state" }
tiangong-cli = { path = "crates/tiangong-cli" }
tiangong-deepseek = { path = "crates/tiangong-deepseek" }
tiangong-config = { path = "crates/tiangong-config" }
tiangong-core = { path = "crates/tiangong-core" }
tiangong-core-manager = { path = "crates/tiangong-core-manager" }
tiangong-entry = { path = "crates/tiangong-entry" }
tiangong-llm = { path = "crates/tiangong-llm" }
tiangong-media = { path = "crates/tiangong-media" }
tiangong-media-archive = { path = "crates/tiangong-media-archive" }
tiangong-memory = { path = "crates/tiangong-memory" }
tiangong-plugin-memory-sidecar = { path = "crates/plugins/tiangong-plugin-memory/sidecar" }
tiangong-plugin-memory-protocol = { path = "crates/plugins/tiangong-plugin-memory/protocol" }
tiangong-plugin-browser = { path = "crates/plugins/tiangong-plugin-browser" }
tiangong-plugin-coding-protocol = { path = "crates/plugins/tiangong-plugin-coding/protocol" }
tiangong-plugin-coding-sidecar = { path = "crates/plugins/tiangong-plugin-coding/sidecar" }
tiangong-plugin-coding-wasm = { path = "crates/plugins/tiangong-plugin-coding/wasm" }
