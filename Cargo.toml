[package]
name = "tiangong"
version = "0.1.0"
edition = "2024"

[lib]
name = "tiangong_core"
path = "src/lib.rs"

[[bin]]
name = "tiangong"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
scru128 = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-openai = { git = "https://github.com/silent-rs/async-openai", branch = "main", package = "async-openai", features = ["byot", "chat-completion", "model"] }
tokio = { version = "1", features = ["rt", "time", "process", "io-util"] }
rmcp = { version = "0.17.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
futures-util = "0.3"
http = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# CLI/TUI 依赖
ratatui = { version = "0.28", features = ["unstable-rendered-line-info"], optional = true }
crossterm = { version = "0.28", optional = true }
unicode-width = { version = "0.2", optional = true }
diffy = { version = "0.4", optional = true }

[features]
default = ["cli"]
cli = ["ratatui", "crossterm", "unicode-width", "diffy"]
tui = ["cli"]

[workspace]
