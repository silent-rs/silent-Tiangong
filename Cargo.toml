[workspace]
resolver = "2"
members = [
    "crates/tiangong-types",
    "crates/tiangong-bots",
    "crates/tiangong-anthropic",
    "crates/tiangong-deepseek",
    "crates/tiangong-llm",
    "crates/tiangong-memory",
    "crates/tiangong-app-state",
    "crates/tiangong-core",
    "crates/tiangong-core-manager",
    "crates/tiangong-cli",
    "crates/tiangong-entry",
    "crates/tiangong-server",
    "crates/tiangong-toolkit",
    "crates/tiangong-media",
    "crates/tiangong-media-archive",
    "crates/tiangong-config",
    "crates/tiangong-scheduler",
    "crates/plugins/tiangong-plugin-browser",
    "crates/plugins/tiangong-plugin-command",
    "crates/plugins/tiangong-plugin-fetch",
    "crates/plugins/tiangong-plugin-fs",
    "crates/plugins/tiangong-plugin-index",
    "crates/plugins/tiangong-plugin-generate-image",
    "crates/plugins/tiangong-plugin-generate-video",
    "crates/plugins/tiangong-plugin-text-to-speech",
    "crates/plugins/tiangong-plugin-speech-to-text",
    "crates/plugins/tiangong-plugin-memory",
    "crates/plugins/tiangong-plugin-scheduler",
    "crates/plugins/tiangong-plugin-task",
    "crates/plugins/tiangong-plugin-terminal",
    "crates/plugins/tiangong-plugin-analyze-attachment",
    "crates/plugins/tiangong-plugin-skill",
    "crates/plugins/tiangong-plugin-mcp",
    "crates/plugins/tiangong-plugin-agent-team",
    "crates/plugins/tiangong-plugin-prompt",
    "src-tauri",
]

[workspace.package]
version = "0.13.1"

[workspace.dependencies]
tiangong-anthropic = { path = "crates/tiangong-anthropic" }
tiangong-app-state = { path = "crates/tiangong-app-state" }
tiangong-cli = { path = "crates/tiangong-cli" }
tiangong-deepseek = { path = "crates/tiangong-deepseek" }
tiangong-config = { path = "crates/tiangong-config" }
tiangong-core = { path = "crates/tiangong-core" }
tiangong-core-manager = { path = "crates/tiangong-core-manager" }
tiangong-entry = { path = "crates/tiangong-entry" }
tiangong-llm = { path = "crates/tiangong-llm" }
tiangong-media = { path = "crates/tiangong-media" }
tiangong-media-archive = { path = "crates/tiangong-media-archive" }
tiangong-memory = { path = "crates/tiangong-memory" }
tiangong-plugin-browser = { path = "crates/plugins/tiangong-plugin-browser" }
tiangong-plugin-command = { path = "crates/plugins/tiangong-plugin-command" }
tiangong-plugin-fetch = { path = "crates/plugins/tiangong-plugin-fetch" }
tiangong-plugin-fs = { path = "crates/plugins/tiangong-plugin-fs" }
tiangong-plugin-index = { path = "crates/plugins/tiangong-plugin-index" }
tiangong-plugin-generate-image = { path = "crates/plugins/tiangong-plugin-generate-image" }
tiangong-plugin-generate-video = { path = "crates/plugins/tiangong-plugin-generate-video" }
tiangong-plugin-text-to-speech = { path = "crates/plugins/tiangong-plugin-text-to-speech" }
tiangong-plugin-speech-to-text = { path = "crates/plugins/tiangong-plugin-speech-to-text" }
tiangong-plugin-memory = { path = "crates/plugins/tiangong-plugin-memory" }
tiangong-plugin-scheduler = { path = "crates/plugins/tiangong-plugin-scheduler" }
tiangong-plugin-task = { path = "crates/plugins/tiangong-plugin-task" }
tiangong-plugin-terminal = { path = "crates/plugins/tiangong-plugin-terminal" }
tiangong-plugin-analyze-attachment = { path = "crates/plugins/tiangong-plugin-analyze-attachment" }
tiangong-plugin-skill = { path = "crates/plugins/tiangong-plugin-skill" }
tiangong-plugin-mcp = { path = "crates/plugins/tiangong-plugin-mcp" }
tiangong-plugin-agent-team = { path = "crates/plugins/tiangong-plugin-agent-team" }
tiangong-plugin-prompt = { path = "crates/plugins/tiangong-plugin-prompt" }
tiangong-server = { path = "crates/tiangong-server" }
tiangong-toolkit = { path = "crates/tiangong-toolkit" }
tiangong-scheduler = { path = "crates/tiangong-scheduler" }
tiangong-types = { path = "crates/tiangong-types" }
tiangong-bots = { path = "crates/tiangong-bots" }

anyhow = "1"
arc-swap = "1"
arrow-array = "58"
arrow-schema = "58"
async-channel = "2"
async-lock = "3"
async-openai = "0.41"
async-trait = "0.1"
backoff = "0.4"
base64 = "0.22"
chrono = { version = "0.4", default-features = false }
clap = "4"
crossterm = "0.29"
dashmap = "6"
diffy = "0.5"
dirs = "6"
eventsource-stream = "0.2"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
libc = "0.2"
sysinfo = "0.39"
lancedb = "0.29"
notify = "8"
qrcode = "0.14"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false }
rmcp = { version = "2", default-features = false }
rusqlite = "0.40"
scraper = "0.27"
scru128 = "4"
semver = "1"
serde = "1"
serde_json = "1"
serial_test = "3"
sha2 = "0.10"
silent = "2"
subtle = "2"
tantivy = "0.24"
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-runtime = "2"
tauri-runtime-wry = "2"
tempfile = "3"
termimad = "0.34"
thiserror = "2"
tokio = "1"
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
typed-builder = "0.23"
wiremock = "0.6"
wry = "0.55"
zip = { version = "8", default-features = false }

[package]
name = "tiangong"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "tiangong"
path = "src/main.rs"

[dependencies]
tiangong-entry = { workspace = true }
tiangong-config = { workspace = true }
anyhow = { workspace = true }
