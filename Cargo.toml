tiangong-plugin-skill-sidecar = { path = "crates/plugins/tiangong-plugin-skill/sidecar" }
tiangong-plugin-skill-wasm = { path = "crates/plugins/tiangong-plugin-skill/wasm" }
tiangong-plugin-mcp-protocol = { path = "crates/plugins/tiangong-plugin-mcp/protocol" }
tiangong-plugin-agent-team = { path = "crates/plugins/tiangong-plugin-agent-team" }
tiangong-plugin-prompt = { path = "crates/plugins/tiangong-plugin-prompt" }
tiangong-plugin-memory-wasm = { path = "crates/plugins/tiangong-plugin-memory/wasm" }
tiangong-plugin-runtime = { path = "crates/tiangong-plugin-runtime" }
tiangong-plugin-sidecar = { path = "crates/tiangong-plugin-sidecar" }
tiangong-server = { path = "crates/tiangong-server" }
tiangong-toolkit = { path = "crates/tiangong-toolkit" }
tiangong-scheduler = { path = "crates/tiangong-scheduler" }
tiangong-types = { path = "crates/tiangong-types" }
tiangong-bots = { path = "crates/tiangong-bots" }

anyhow = "1"
arc-swap = "1"
async-channel = "2"
async-lock = "3"
async-openai = "0.41"
async-trait = "0.1"
backoff = "0.4"
base64 = "0.22"
chrono = { version = "0.4", default-features = false }
clap = "4"
crossterm = "0.29"
cron = "0.16"
dashmap = "6"
diffy = "0.5"
dirs = "6"
eventsource-stream = "0.2"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
jsonschema = { version = "0.33", default-features = false }
libc = "0.2"
sysinfo = "0.39"
lancedb = "0.31"
notify = "8"
qrcode = "0.14"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false }
rmcp = { version = "2", default-features = false }
rusqlite = "0.40"
scraper = "0.27"
scru128 = "4"
semver = "1"
serde = "1"
serde_json = "1"
serial_test = "3"
sha2 = "0.10"
silent = "2"
subtle = "2"
tantivy = "0.26"
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-runtime = "2"
tauri-runtime-wry = "2"
tempfile = "3"
termimad = "0.35"
thiserror = "2"
tokio = "1"
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
typed-builder = "0.23"
wiremock = "0.6"
wry = "=0.55.1"
wasmtime = { version = "47", default-features = false, features = [
    "cranelift",
    "runtime",
    "component-model",
    "parallel-compilation",
    "pooling-allocator",
    "cache",
] }
wasmtime-wasi = { version = "47", default-features = false }
wit-bindgen = "0.46"
zip = { version = "8", default-features = false }

[patch.crates-io]
wry = { git = "https://github.com/silent-rs/wry.git", rev = "4fb16fa0ca6b4b8fa65edc5d3875d9726429285b" }

[package]
name = "tiangong"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "tiangong"
path = "src/main.rs"

[dependencies]
tiangong-entry = { workspace = true }
tiangong-config = { workspace = true }
anyhow = { workspace = true }
