    "crates/tiangong-entry",
    "crates/tiangong-server",
    "crates/tiangong-toolkit",
    "crates/tiangong-media",
    "crates/tiangong-media-archive",
    "crates/tiangong-config",
    "crates/tiangong-scheduler",
    "crates/plugins/tiangong-plugin-browser",
    "crates/plugins/tiangong-plugin-coding/protocol",
    "crates/plugins/tiangong-plugin-coding/sidecar",
    "crates/plugins/tiangong-plugin-coding/wasm",
    "crates/plugins/tiangong-plugin-command",
    "crates/plugins/tiangong-plugin-fetch",
    "crates/plugins/tiangong-plugin-fs",
    "crates/plugins/tiangong-plugin-index/protocol",
    "crates/plugins/tiangong-plugin-index/sidecar",
    "crates/plugins/tiangong-plugin-index/wasm",
    "crates/plugins/tiangong-plugin-generate-image/protocol",
    "crates/plugins/tiangong-plugin-generate-image/sidecar",
    "crates/plugins/tiangong-plugin-generate-image/wasm",
    "crates/plugins/tiangong-plugin-generate-video",
    "crates/plugins/tiangong-plugin-text-to-speech/protocol",
    "crates/plugins/tiangong-plugin-text-to-speech/sidecar",
    "crates/plugins/tiangong-plugin-text-to-speech/wasm",
    "crates/plugins/tiangong-plugin-speech-to-text",
    "crates/plugins/tiangong-plugin-memory/protocol",
    "crates/plugins/tiangong-plugin-memory/wasm",
    "crates/plugins/tiangong-plugin-memory/sidecar",
    "crates/plugins/tiangong-plugin-scheduler/protocol",
    "crates/plugins/tiangong-plugin-scheduler/wasm",
    "crates/plugins/tiangong-plugin-scheduler/sidecar",
    "crates/plugins/tiangong-plugin-task",
    "crates/plugins/tiangong-plugin-terminal",
    "crates/plugins/tiangong-plugin-analyze-attachment/protocol",
