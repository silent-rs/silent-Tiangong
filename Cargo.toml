[package]
name = "tiangong"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
hetu = { git = "ssh://git@github.com/silent-rs/silent-hetu.git" }
scru128 = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-openai = "0.30"
tokio = { version = "1", features = ["rt", "time"] }
futures-util = "0.3"
ratatui = { version = "0.28", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
unicode-width = "0.2"

[workspace]
