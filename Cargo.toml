[workspace]
members = [
    "crates/tiangong-types",
    "crates/tiangong-llm",
    "crates/tiangong-core",
    "crates/tiangong-cli",
    "crates/tiangong-entry",
    "crates/tiangong-server",
    "crates/tiangong-gateway",
    "crates/tiangong-connector",
    "crates/tiangong-media",
    "crates/tiangong-config",
]
exclude = ["src-tauri"]

[package]
name = "tiangong"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "tiangong"
path = "src/main.rs"

[dependencies]
tiangong-entry = { path = "crates/tiangong-entry" }
tiangong-config = { path = "crates/tiangong-config" }
anyhow = "1"
