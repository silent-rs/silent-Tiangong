[workspace]
resolver = "2"
members = [
    "crates/tiangong-types",
    "crates/tiangong-anthropic",
    "crates/tiangong-llm",
    "crates/tiangong-memory",
    "crates/tiangong-core",
    "crates/tiangong-cli",
    "crates/tiangong-entry",
    "crates/tiangong-server",
    "crates/tiangong-media",
    "crates/tiangong-config",
    "src-tauri",
]

[workspace.package]
version = "0.2.0"

[workspace.dependencies]
tiangong-anthropic = { path = "crates/tiangong-anthropic" }
tiangong-cli = { path = "crates/tiangong-cli" }
tiangong-config = { path = "crates/tiangong-config" }
tiangong-core = { path = "crates/tiangong-core" }
tiangong-entry = { path = "crates/tiangong-entry" }
tiangong-llm = { path = "crates/tiangong-llm" }
tiangong-media = { path = "crates/tiangong-media" }
tiangong-memory = { path = "crates/tiangong-memory" }
tiangong-server = { path = "crates/tiangong-server" }
tiangong-types = { path = "crates/tiangong-types" }

anyhow = "1"
arc-swap = "1"
arrow-array = "58"
arrow-schema = "58"
async-channel = "2"
async-lock = "3"
async-openai = "0.40"
async-trait = "0.1"
backoff = "0.4"
base64 = "0.22"
chrono = { version = "0.4", default-features = false }
clap = "4"
crossterm = "0.28"
diffy = "0.4"
eventsource-stream = "0.2"
futures-util = "0.3"
hex = "0.4"
http = "1"
libc = "0.2"
lancedb = "0.29"
ratatui = "0.28"
reqwest = { version = "0.12", default-features = false }
rmcp = { version = "0.17.0", default-features = false }
rusqlite = "0.32"
scraper = "0.19"
scru128 = "3"
semver = "1"
serde = "1"
serde_json = "1"
serial_test = "3"
sha2 = "0.10"
silent = "2"
tantivy = "0.22"
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-runtime = "=2.10.1"
tauri-runtime-wry = "=2.10.1"
tempfile = "3"
termimad = "0.30"
thiserror = "2"
tokio = "1"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
wry = "=0.54.3"
zip = { version = "2", default-features = false }

[package]
name = "tiangong"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "tiangong"
path = "src/main.rs"

[dependencies]
tiangong-entry = { workspace = true }
tiangong-config = { workspace = true }
anyhow = { workspace = true }
