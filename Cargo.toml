tiangong-plugin-generate-image-protocol = { path = "crates/plugins/tiangong-plugin-generate-image/protocol" }
tiangong-plugin-generate-image-sidecar = { path = "crates/plugins/tiangong-plugin-generate-image/sidecar" }
