[package]
name = "tiangong-app"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[dependencies]
# 引用核心库 crate
tiangong-core = { workspace = true }
tiangong-core-manager = { workspace = true }
tiangong-llm = { workspace = true }
tiangong-app-state = { workspace = true }
tiangong-media-archive = { workspace = true }
tiangong-types = { workspace = true }
tiangong-toolkit = { workspace = true }
tiangong-bots = { workspace = true }
tiangong-cli = { workspace = true }
tiangong-entry = { workspace = true }
tiangong-server = { workspace = true }
tiangong-plugin-browser = { workspace = true }
tiangong-plugin-fs = { workspace = true }
tiangong-plugin-runtime = { workspace = true }
tiangong-plugin-task = { workspace = true }
tiangong-plugin-terminal = { workspace = true }
tiangong-plugin-skill-protocol = { workspace = true }
tiangong-plugin-mcp-protocol = { workspace = true }
tiangong-plugin-index-protocol = { workspace = true }
tiangong-plugin-agent-team = { workspace = true }
tiangong-media = { workspace = true }
tiangong-config = { workspace = true }
tiangong-scheduler = { workspace = true }
silent = { workspace = true, features = ["scheduler"] }
async-trait = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
base64 = { workspace = true }
chrono = { workspace = true, default-features = false, features = ["std", "clock"] }
scru128 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
async-openai = { workspace = true, features = ["byot", "chat-completion", "model"] }
tokio = { workspace = true, features = ["rt", "time", "process", "io-util", "sync", "signal"] }
tracing = { workspace = true }
rmcp = { workspace = true, default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
futures-util = { workspace = true }
http = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls"] }

# Tauri 相关依赖
tauri = { workspace = true, features = ["protocol-asset", "tray-icon", "unstable"] }
tauri-plugin-shell = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-runtime = { workspace = true }
tauri-runtime-wry = { workspace = true }
wry = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[features]
default = []
cli = []
llm-debug-log = ["tiangong-core/llm-debug-log"]
