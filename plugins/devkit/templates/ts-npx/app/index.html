<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>{{PLUGIN_NAME}}</title>
  <style>
    * { box-sizing: border-box; }
    .app {
      min-height: 100%;
      padding: 14px;
      font-family: inherit;
      font-size: 13px;
      background: hsl(var(--background, 0 0% 100%));
      color: hsl(var(--foreground, 222.2 47.4% 11.2%));
    }
    h2 { margin: 0 0 8px; font-size: 15px; }
    .hint { color: hsl(var(--muted-foreground, 215.4 16.3% 46.9%)); font-size: 11px; margin: 8px 0; }
    pre {
      margin: 0; padding: 10px; overflow: auto;
      border-radius: var(--radius, 0.5rem);
      background: hsl(var(--muted, 210 40% 96.1%));
      font-size: 11px; white-space: pre-wrap; word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="app">
    <h2>{{PLUGIN_NAME}}</h2>
    <p class="hint">
      本插件以 npx 命令行脚本形式提供能力（无 sidecar、无构建）。需要时让 Agent
      在对话中执行下面的命令；开发期可在「插件创作」页用试运行按钮直接跑一次。
      改造入口：tools/main.ts（脚本逻辑）与 plugin.json 的能力说明段。
    </p>
    <pre id="usage">npx -y tsx@4.19.2 ~/.tiangong/plugins/{{PLUGIN_ID}}/tools/main.ts --name 名字</pre>
    <p class="hint">脚本向 stdout 输出 JSON 结果；首次运行需联网下载 tsx（命令网络审批放行一次）。</p>
  </div>
</body>
</html>
