[package]
name = "tiangong-plugin-fs-wasm"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "Fs 插件的 WASM 桥接组件"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tiangong-plugin-fs-protocol = { workspace = true }
wit-bindgen = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["alloc"] }
