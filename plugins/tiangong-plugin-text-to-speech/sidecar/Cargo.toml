[package]
name = "tiangong-plugin-text-to-speech-sidecar"
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
description = "Text-To-Speech 独立 sidecar（读取模型配置、调用 TTS 供应商、音频落盘）"
publish = false

[[bin]]
name = "tiangong-text-to-speech-sidecar"
path = "src/main.rs"

[dependencies]
tiangong-plugin-text-to-speech-protocol = { workspace = true }
tiangong-plugin-runtime = { workspace = true }
tiangong-plugin-sidecar = { workspace = true }
tiangong-core = { workspace = true }
tiangong-llm = { workspace = true }
tiangong-config = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal", "macros", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
scru128 = { workspace = true }
