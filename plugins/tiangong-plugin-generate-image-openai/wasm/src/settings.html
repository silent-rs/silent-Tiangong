<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenAI 生图</title>
  <style>/*__SETTINGS_CSS__*/</style>
</head>
<body>
  <main class="page">
    <div class="header">
      <h2>OpenAI 生图</h2>
      <p class="desc">通过 OpenAI 兼容的 Chat Completions 接口生成图片。可以选择模型配置中的模型，或手动输入端点。</p>
    </div>

    <section class="card">
      <h3 class="card-title">模型来源</h3>
      <div class="radio-group">
        <label class="radio">
          <input type="radio" name="source" value="global" id="source-global" checked />
          <span>选择模型配置</span>
        </label>
        <label class="radio">
          <input type="radio" name="source" value="manual" id="source-manual" />
          <span>手动输入</span>
        </label>
      </div>

      <!-- 选择模型配置 -->
      <div id="global-section" class="sub-section">
        <label class="field">
          <span class="label">模型</span>
          <select id="global-model" class="input">
            <option value="">加载中...</option>
          </select>
          <span class="hint" id="global-hint"></span>
        </label>
      </div>

      <!-- 手动输入 -->
      <div id="manual-section" class="sub-section" hidden>
        <label class="field">
          <span class="label">Base URL</span>
          <input id="manual-base-url" class="input" type="text" placeholder="https://api.openai.com/v1" autocomplete="off" />
        </label>
        <label class="field">
          <span class="label">API Key</span>
          <input id="manual-api-key" class="input" type="password" placeholder="sk-...（支持 ${ENV_VAR}）" autocomplete="off" />
        </label>
        <label class="field">
          <span class="label">Model ID</span>
          <input id="manual-model" class="input" type="text" placeholder="gpt-4o-image" autocomplete="off" />
        </label>
      </div>
    </section>

    <section class="card">
      <h3 class="card-title">生成选项</h3>
      <label class="field checkbox-field">
        <input type="checkbox" id="enable-modalities" />
        <span class="label-inline">启用图片输出（modalities）</span>
      </label>
      <p class="hint">部分服务需要勾选此项以触发图片生成（请求带 modalities:["text","image"]）。如果生成的图片以 markdown 链接形式返回，通常无需勾选。</p>

      <label class="field">
        <span class="label">附加系统提示（可选）</span>
        <textarea id="extra-prompt" class="input textarea" rows="3" placeholder="留空则不附加系统提示"></textarea>
      </label>
    </section>

    <div class="actions">
      <span id="status" class="status"></span>
      <button id="save-btn" class="btn btn-primary" type="button">保存</button>
    </div>
  </main>
  <script>/*__SETTINGS_JS__*/</script>
</body>
</html>
