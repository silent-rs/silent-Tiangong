[package]
name = "tiangong-plugin-analyze-attachment-wasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Analyze-Attachment 插件的 WASM 组件"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tiangong-plugin-analyze-attachment-protocol = { workspace = true }
tiangong-types = { workspace = true }
wit-bindgen = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
