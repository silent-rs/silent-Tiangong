[package]
name = "tiangong-plugin-generate-video-wasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Generate-Video 插件的 WASM 组件"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tiangong-plugin-generate-video-protocol = { workspace = true }
wit-bindgen = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
