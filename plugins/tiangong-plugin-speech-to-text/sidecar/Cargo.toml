[package]
name = "tiangong-plugin-speech-to-text-sidecar"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "Speech-To-Text 独立 sidecar（读取模型配置、读取音频、调用 STT 供应商）"
publish = false

[[bin]]
name = "tiangong-speech-to-text-sidecar"
path = "src/main.rs"

[dependencies]
tiangong-plugin-speech-to-text-protocol = { workspace = true }
tiangong-plugin-runtime = { workspace = true }
tiangong-plugin-sidecar = { workspace = true }
tiangong-core = { workspace = true }
tiangong-llm = { workspace = true }
tiangong-config = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal", "macros", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
