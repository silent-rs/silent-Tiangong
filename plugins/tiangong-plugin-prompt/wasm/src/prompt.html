<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>自定义指令</title>
  <style>/*__PROMPT_CSS__*/</style>
</head>
<body>
  <main class="page">
    <div class="header">
      <h2>自定义指令</h2>
      <p class="desc">在此编辑的指令会作为系统提示的一部分注入每次对话，优先级低于系统安全规则。</p>
    </div>
    <textarea id="prompt-editor" class="prompt-editor" placeholder="输入自定义指令，例如：总是使用简体中文回复..." rows="12"></textarea>
    <div class="actions">
      <span id="status" class="status"></span>
      <button id="save-btn" class="btn btn-primary" type="button">保存</button>
    </div>
  </main>
  <script>/*__PROMPT_JS__*/</script>
</body>
</html>
