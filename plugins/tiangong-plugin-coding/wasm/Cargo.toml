[package]
name = "tiangong-plugin-coding-wasm"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "Coding 专用工作模式 WASM 插件"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
