<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCP 管理</title>
  <style>/*__MCP_CSS__*/</style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>MCP 服务器</h1>
        <div id="runtime-status" class="runtime-status">正在连接</div>
      </div>
      <div class="header-actions">
        <button id="refresh-button" class="secondary-button" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66L20 8"/><path d="M20 4v4h-4"/></svg>
          刷新
        </button>
        <button id="add-button" class="primary-button" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          添加服务器
        </button>
      </div>
    </header>

    <main>
      <section class="stats" aria-label="MCP 服务器统计">
        <div><span>服务器</span><strong id="stat-total">0</strong></div>
        <div><span>已启用</span><strong id="stat-enabled">0</strong></div>
        <div><span>连接正常</span><strong id="stat-healthy">0</strong></div>
        <div><span>可用工具</span><strong id="stat-tools">0</strong></div>
      </section>

      <section class="server-panel" aria-label="MCP 服务器列表">
        <div class="list-heading">
          <div>
            <h2>服务器配置</h2>
            <p>启用后的服务器会在新一轮对话中提供工具。</p>
          </div>
        </div>
        <div id="server-list" class="server-list"></div>
        <div id="empty-state" class="empty-state hidden">
          <strong>暂无 MCP 服务器</strong>
          <span>添加一个本地命令或远程端点。</span>
        </div>
        <div id="loading-state" class="loading-state">
          <span class="spinner"></span>
          <span>加载中</span>
        </div>
      </section>
    </main>
  </div>

  <div id="server-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-panel">
      <div class="modal-heading">
        <h2 id="modal-title">添加 MCP 服务器</h2>
        <button id="modal-close" class="icon-button" type="button" title="关闭" aria-label="关闭">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></svg>
        </button>
      </div>

      <form id="server-form" class="server-form">
        <label class="field field-wide">
          <span>名称</span>
          <input id="server-name" type="text" maxlength="100" placeholder="my-mcp-server" autocomplete="off" required>
        </label>

        <label class="field field-wide">
          <span>连接方式</span>
          <select id="server-transport">
            <option value="stdio">本地命令（stdio）</option>
            <option value="http">远程端点（HTTP / SSE）</option>
          </select>
        </label>

        <div id="stdio-fields" class="conditional-fields field-wide">
          <label class="field">
            <span>命令</span>
            <input id="server-command" type="text" placeholder="npx" autocomplete="off">
          </label>
          <label class="field">
            <span>参数</span>
            <input id="server-args" type="text" placeholder="-y @modelcontextprotocol/server-filesystem" autocomplete="off">
          </label>
          <label class="field">
            <span>环境变量</span>
            <textarea id="server-env" rows="4" placeholder="PATH=/usr/bin&#10;NODE_ENV=production"></textarea>
            <small>每行一项，格式为 KEY=VALUE。</small>
          </label>
        </div>

        <div id="http-fields" class="conditional-fields field-wide hidden">
          <label class="field">
            <span>Endpoint</span>
            <input id="server-endpoint" type="url" placeholder="https://example.com/mcp" autocomplete="off">
          </label>
          <label class="field">
            <span>认证 Header</span>
            <input id="server-auth-header" type="password" placeholder="Bearer ..." autocomplete="new-password">
          </label>
          <label class="field">
            <span>自定义 Headers</span>
            <textarea id="server-headers" rows="4" placeholder="X-API-Key=...&#10;X-Client=tiangong"></textarea>
            <small>每行一项，格式为 KEY=VALUE。</small>
          </label>
        </div>

        <div class="modal-actions field-wide">
          <span id="form-error" class="form-error" role="alert"></span>
          <button id="cancel-button" class="secondary-button" type="button">取消</button>
          <button id="save-button" class="primary-button" type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="remove-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="remove-modal-title">
    <div class="modal-panel confirm-panel">
      <div class="modal-heading">
        <h2 id="remove-modal-title">删除 MCP 服务器</h2>
        <button id="remove-modal-close" class="icon-button" type="button" title="关闭" aria-label="关闭">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="confirm-body">
        <p id="remove-message"></p>
        <div class="modal-actions">
          <button id="remove-cancel" class="secondary-button" type="button">取消</button>
          <button id="remove-confirm" class="danger-button" type="button">删除</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script>/*__MCP_JS__*/</script>
</body>
</html>
