name: skill_creator
version: 1.0.0
description: 元技能 - 快速创建新的skill模板
author: TianGong Team
tags:
  - meta
  - productivity
  - development
parameters:
  skill_name:
    type: string
    description: 要创建的skill名称
    required: true
  skill_type:
    type: string
    description: skill类型
    enum:
      - search
      - automation
      - analysis
      - integration
      - utility
    default: utility
  description:
    type: string
    description: skill功能描述
    required: true
  author:
    type: string
    description: 作者名称
    default: TianGong User
  include_examples:
    type: boolean
    description: 是否包含示例代码
    default: true
output:
  type: directory
  description: 生成的skill目录路径
