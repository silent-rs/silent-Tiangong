fail_fast: false
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-byte-order-marker
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^src-tauri/gen/schemas/
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: \.py$
  - repo: local
    hooks:
      - id: cargo-fmt-workspace
        name: cargo fmt --all --check
        description: Check Rust formatting for the workspace.
        entry: bash -lc 'cargo fmt --all -- --check'
        language: system
        files: (\.rs$|Cargo\.toml$|Cargo\.lock$|rustfmt\.toml$|\.cargo/.*\.toml$)
        pass_filenames: false
      # 以下三个 hook 与 CI 保持一致：只校验被直接改动的 crate，而非全量 workspace。
      # pre-commit 把改动的文件路径传给脚本，脚本提取 crate 名后用 cargo -p 执行。
      - id: cargo-check-crates
        name: cargo check (changed crates)
        description: Check only crates with direct changes, mirroring CI.
        entry: bash scripts/pre-commit-affected-crates.sh check
        language: system
        files: (\.rs$|Cargo\.toml$|Cargo\.lock$|\.cargo/.*\.toml$)
        require_serial: true
        stages: [pre-push]
      - id: cargo-clippy-crates
        name: cargo clippy (changed crates)
        description: Lint only crates with direct changes, mirroring CI.
        entry: bash scripts/pre-commit-affected-crates.sh clippy
        language: system
        files: (\.rs$|Cargo\.toml$|Cargo\.lock$|\.cargo/.*\.toml$)
        require_serial: true
        stages: [pre-push]
      - id: cargo-nextest-crates
        name: cargo nextest (changed crates)
        description: Test only crates with direct changes, mirroring CI.
        entry: bash scripts/pre-commit-affected-crates.sh nextest
        language: system
        files: (\.rs$|Cargo\.toml$|Cargo\.lock$|\.cargo/.*\.toml$)
        require_serial: true
        stages: [pre-push]
      - id: frontend-build
        name: yarn build (frontend)
        description: Build the frontend bundle.
        entry: bash -lc 'cd frontend && yarn build'
        language: system
        files: ^frontend/
        pass_filenames: false
        stages: [pre-push]
      - id: frontend-test
        name: yarn test (frontend)
        description: Run frontend unit tests.
        entry: bash -lc 'cd frontend && yarn test'
        language: system
        files: ^frontend/
        pass_filenames: false
        stages: [pre-push]
